<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Physics</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/subjects.css">
</head>
<body>
  <header>
    <a href="physics.html">Physics</a>
  </header>
  <main class="topics-container">
    <div class="topic">
      <img src="../images/mechanics.webp" alt="Mechanics" class="topic-image" loading="lazy">
      <button aria-label="Learn about Mechanics">Learn</button>
    </div>
    <div class="topic">
      <img src="../images/thermodynamics.jpg" alt="Thermodynamics" class="topic-image" loading="lazy">
      <button aria-label="Learn about Thermodynamics">Learn</button>
    </div>
    <div class="topic">
      <img src="../images/electromagnetism.webp" alt="Electromagnetism" class="topic-image" loading="lazy">
      <button aria-label="Learn about Electromagnetism">Learn</button>
    </div>
    <div class="topic">
      <img src="../images/quantum-mechanics.webp" alt="Quantum Mechanics" class="topic-image" loading="lazy">
      <button aria-label="Learn about Quantum Mechanics">Learn</button>
    </div>
    <div class="topic">
      <img src="../images/relativity.webp" alt="Relativity" class="topic-image" loading="lazy">
      <button aria-label="Learn about Relativity">Learn</button>
    </div>
    <div class="topic">
      <img src="../images/particle-physics.jpeg" alt="Particle Physics" class="topic-image" loading="lazy">
      <button aria-label="Learn about Particle Physics">Learn</button>
    </div>
    <div class="topic">
      <img src="../images/atomic-&-molecular-physics.jpeg" alt="Atomic & Molecular Physics" class="topic-image" loading="lazy">
      <button aria-label="Learn about Atomic & Molecular Physics">Learn</button>
    </div>
    <div class="topic">
      <img src="../images/plasma-physics.jpg" alt="Plasma Physics" class="topic-image" loading="lazy">
      <button aria-label="Learn about Plasma Physics">Learn</button>
    </div>
  </main>
  <script>
    document.querySelectorAll('.topic button').forEach((btn, index) => {
      btn.addEventListener('click', () => {
        window.location.href = `../display.html?subject=physics&id=${index + 1}`;
      });
    });
  </script>
</body>
</html>
