<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading Topic...</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="index.html" id="back-link">Back</a>
    </nav>
  </header>

  <main id="content-area">
    <p>Loading content...</p>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pageId = urlParams.get('id');
    const subject = urlParams.get('subject') || 'physics';

    const backLink = document.getElementById('back-link');
    if (backLink) {
      backLink.href = `${subject}.html`;
      const formattedSubject = subject.charAt(0).toUpperCase() + subject.slice(1);
      backLink.innerText = `Back to ${formattedSubject}`;
    }
  </script>
</body>
</html>
