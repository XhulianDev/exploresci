<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <header>
    <a href="astronomy.html">Astronomy</a>

      <button onclick="openDoc2()" aria-label="Learn about Universe">Learn</button>
    </div>
    <div class="topic">
      <img src="../images/stars.webp" alt="Stars" class="topic-image" loading="lazy">
      <button onclick="openDoc3()" aria-label="Learn about Stars">Learn</button>

      <button onclick="openDoc8()" aria-label="Learn about Planets">Learn</button>
    </div>
  </main>
  <script>
    document.querySelectorAll('.topic button').forEach((btn, index) => {
      btn.addEventListener('click', () => {
        window.location.href = `page-${index + 1}.html`;
      });
    });
  </script>
</body>
</html>
